version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queue_api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      - redis # Diz ao Docker: "Ligue o Redis antes de ligar a API"

  # --- NOVO CONTAINER AQUI ---
  redis:
    image: redis:7-alpine # A versão 'alpine' é super leve e rápida
    container_name: queue_redis
    ports:
      - "6379:6379" # Expõe a porta padrão do Redis